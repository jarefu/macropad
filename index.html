<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MacroPad RP2040 Web Configurator</title>
  <style>
    :root {
      --bg: #121316;
      --panel: #1e2026;
      --border: #323642;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); }
    .container { max-width: 1050px; margin: 0 auto; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 12px;
    }
    h1 { margin: 0; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); display: inline-block; }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
    
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.9rem;
      transition: all 0.15s;
    }
    button:hover:not(:disabled) { border-color: var(--muted); background: #282b33; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.success { background: var(--success); border-color: var(--success); color: #fff; }
    button.danger { color: var(--danger); border-color: rgba(239,68,68,0.4); }
    button.danger:hover:not(:disabled) { background: rgba(239,68,68,0.1); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .workspace { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 820px) { .workspace { grid-template-columns: 1fr; } }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .card h2 { margin: 0 0 16px 0; font-size: 1.05rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Hardware Device Mockup */
    .device-shell {
      background: #0b0c0e; border: 2px solid #2a2d36; border-radius: 16px;
      padding: 18px; width: 100%; max-width: 300px; margin: 0 auto;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    }
    .device-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
    .oled-screen {
      background: #000; border: 2px solid #333; border-radius: 4px; padding: 8px;
      font-family: "Courier New", monospace; font-size: 11px; line-height: 1.35;
      color: #fff; width: 185px; height: 82px; white-space: pre; overflow: hidden;
    }
    .encoder-knob {
      width: 52px; height: 52px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #444, #181818);
      border: 3px solid #555; box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: #aaa; text-align: center; cursor: pointer; user-select: none;
    }
    .encoder-knob:active { transform: scale(0.95); }

    .key-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .keycap {
      aspect-ratio: 1; background: #1a1c22; border: 2px solid #333; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; transition: transform 0.1s, border-color 0.15s;
      user-select: none; padding: 4px;
    }
    .keycap:hover { transform: translateY(-2px); border-color: #666; }
    .keycap.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
    .keycap .key-num { position: absolute; top: 4px; left: 6px; font-size: 10px; color: rgba(255,255,255,0.45); }
    .keycap .key-lbl { font-weight: 600; font-size: 13px; text-align: center; word-break: break-all; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
    .keycap .key-type { font-size: 9px; color: rgba(255,255,255,0.65); margin-top: 3px; }

    /* Forms & Controls */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input[type="text"], select, textarea {
      width: 100%; padding: 9px 11px; background: #14161a; border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; font-size: 0.92rem;
    }
    textarea { resize: vertical; min-height: 70px; font-family: monospace; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

    .mods-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .mod-pill {
      padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: #14161a; font-size: 0.82rem; cursor: pointer; user-select: none;
    }
    .mod-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .preset-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .preset-btn { font-size: 0.78rem; padding: 5px 10px; border-radius: 4px; }
    
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #282c34; border-left: 4px solid var(--accent);
      padding: 12px 18px; border-radius: 6px; box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(10px); transition: all 0.25s; pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>
      <span id="statusDot" class="status-dot"></span>
      MacroPad RP2040 Configurator
    </h1>
    <div class="toolbar">
      <button id="btnConnect" class="primary" onclick="connectSerial()">Connect via USB</button>
      <button id="btnPull" onclick="requestConfig()" disabled>Read from Pad</button>
      <button id="btnPush" class="success" onclick="pushConfig()" disabled>Save to MacroPad</button>
      <button onclick="exportJSON()">Export JSON</button>
      <button onclick="document.getElementById('fileInput').click()">Import JSON</button>
      <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </header>

  <div class="workspace">
    <!-- LEFT: HARDWARE PREVIEW -->
    <div class="card">
      <h2>Live Hardware Preview</h2>
      <div class="device-shell">
        <div class="device-top">
          <div id="oledPreview" class="oled-screen">1/2 PC 1 S:ON</div>
          <div class="encoder-knob" onclick="cycleProfile()" title="Click to switch active page">
            ROTATE<br>PAGE
          </div>
        </div>
        <div id="keyGrid" class="key-grid"></div>
      </div>
      <p style="text-align:center; font-size:0.8rem; color:var(--muted); margin: 14px 0 0 0;">
        Click any key above to edit it, or click the knob to cycle pages.
      </p>
    </div>
